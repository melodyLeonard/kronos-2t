<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kronos Quick Prompt</title>
<style>
  :root {
    --bg: #191a1f;
    --panel: #22242b;
    --line: rgba(255, 255, 255, 0.11);
    --text: #f3f4f6;
    --muted: #9ca3af;
    --accent: #0d9488;
    --accent-warm: #d97757;
    --code: #121317;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  body.standalone {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 11vh 20px 20px;
    background: #0f1014;
  }
  #shell {
    display: flex;
    flex-direction: column;
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
  }
  body.standalone #shell {
    max-width: 680px;
    box-shadow: 0 22px 54px rgba(0, 0, 0, 0.52);
  }
  #shell.drag-over {
    border-color: var(--accent);
  }
  #shell.is-dragging,
  #shell.is-dragging * {
    cursor: grabbing;
  }
  #drag-bar {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 24px;
    padding: 4px 12px 0;
    cursor: grab;
  }
  .drag-brand {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: #7c828f;
  }
  .drag-pill {
    position: absolute;
    left: 50%;
    top: 9px;
    transform: translateX(-50%);
    width: 40px;
    height: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.2);
    transition: background 0.14s ease;
    pointer-events: none;
  }
  #drag-bar:hover .drag-pill,
  #shell.is-dragging .drag-pill {
    background: rgba(255, 255, 255, 0.42);
  }
  .hud-win-btns {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .hud-icon-btn {
    width: 22px;
    height: 20px;
    border: none;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.05);
    color: #c5cad3;
    font: inherit;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .hud-icon-btn:hover {
    background: var(--panel);
    color: #fff;
  }
  #q-close:hover {
    background: rgba(217, 119, 87, 0.28);
    color: #fff;
  }
  .top-row {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 6px 15px 10px;
    cursor: grab;
  }
  .brand-mark {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent-warm);
    cursor: grab;
  }
  #q-input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    color: var(--text);
    font: 16px/1.38 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    max-height: 96px;
    padding: 2px 0;
    user-select: text;
  }
  #q-input::placeholder {
    color: #8b909c;
  }
  #sess-select {
    max-width: 150px;
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 4px 7px;
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
    outline: none;
  }
  #sess-select:hover {
    background: var(--panel);
    color: var(--text);
  }
  #q-voice {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--panel);
    color: #d1d5db;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease;
  }
  #q-voice:hover {
    border-color: rgba(255, 255, 255, 0.28);
    color: #fff;
  }
  #q-voice.recording {
    background: rgba(217, 119, 87, 0.22);
    border-color: var(--accent-warm);
    color: #ffb49a;
    animation: qVoicePulse 1.25s ease-in-out infinite;
  }
  #q-voice.transcribing {
    background: rgba(13, 148, 136, 0.2);
    border-color: var(--accent);
    color: #5eead4;
    cursor: progress;
  }
  @keyframes qVoicePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(217, 119, 87, 0.42); }
    50% { box-shadow: 0 0 0 5px rgba(217, 119, 87, 0.08); }
  }
  #q-voice-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 0 15px 9px;
    padding: 7px 11px;
    border-radius: 10px;
    background: rgba(217, 119, 87, 0.11);
    border: 1px solid rgba(217, 119, 87, 0.34);
    font-size: 12px;
    color: var(--text);
  }
  #q-voice-bar.active {
    display: flex;
  }
  #q-voice-bar.denied {
    background: rgba(245, 158, 11, 0.12);
    border-color: rgba(245, 158, 11, 0.4);
  }
  .q-voice-left {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }
  .q-eq {
    display: inline-flex;
    align-items: center;
    gap: 2.5px;
    height: 16px;
    flex-shrink: 0;
  }
  .q-eq span {
    width: 3px;
    height: 4px;
    border-radius: 99px;
    background: var(--accent-warm);
    transition: height 0.09s ease;
  }
  #q-voice-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #e5e7eb;
  }
  .q-voice-btns {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  #q-send {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border: none;
    border-radius: 9px;
    background: var(--accent-warm);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #q-send:disabled {
    opacity: 0.45;
    cursor: default;
  }
  #tray {
    display: none;
    flex-wrap: wrap;
    gap: 7px;
    padding: 0 15px 9px;
  }
  #tray.has-items {
    display: flex;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 3px 8px 3px 5px;
    font-size: 11.5px;
    color: var(--text);
  }
  .chip img {
    width: 24px;
    height: 24px;
    object-fit: cover;
    border-radius: 4px;
  }
  .chip-tag {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(13, 148, 136, 0.22);
    color: #5eead4;
  }
  .chip button {
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    padding: 0 2px;
    font-size: 13px;
  }
  #answer-wrap {
    display: none;
    flex-direction: column;
    max-height: 310px;
    overflow-y: auto;
    border-top: 1px solid var(--line);
    padding: 11px 16px;
    gap: 9px;
    background: rgba(16, 17, 21, 0.65);
    user-select: text;
  }
  #answer-wrap.open {
    display: flex;
  }
  .q-turn-user {
    align-self: flex-end;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 6px 11px;
    font-size: 12.5px;
    color: #e5e7eb;
    max-width: 86%;
    white-space: pre-wrap;
  }
  .q-turn-reply {
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .q-turn-reply pre {
    background: var(--code);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 11px;
    overflow-x: auto;
    margin: 7px 0;
  }
  .q-turn-reply code {
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .q-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 4px;
  }
  .q-pill {
    font-size: 10.5px;
    padding: 1px 7px;
    border-radius: 999px;
    background: rgba(13, 148, 136, 0.18);
    color: #5eead4;
    border: 1px solid rgba(94, 234, 212, 0.25);
  }
  .bar-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 15px 10px;
    border-top: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.02);
    cursor: grab;
  }
  .meta-left {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    color: var(--muted);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .actions-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .act-btn {
    background: transparent;
    color: #d1d5db;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 10px;
    font: inherit;
    font-size: 11.5px;
    cursor: pointer;
  }
  .act-btn:hover {
    background: var(--panel);
    border-color: rgba(255, 255, 255, 0.24);
  }
  .act-btn.dev-on {
    border-color: rgba(94, 234, 212, 0.42);
    color: #5eead4;
    background: rgba(13, 148, 136, 0.14);
  }
  .q-open-chip {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  .q-open-chip:hover {
    border-color: var(--accent);
    color: #5eead4;
  }
</style>
</head>
<body>
<div id="shell">
  <div id="drag-bar" title="Drag to move Quick Prompt · Double-click to re-center">
    <span class="drag-brand">Kronos</span>
    <span class="drag-pill"></span>
    <div class="hud-win-btns">
      <button id="q-new" class="hud-icon-btn" type="button" title="New Quick Chat (Cmd+N)">+</button>
      <button id="q-close" class="hud-icon-btn" type="button" title="Hide Quick Prompt (Esc)">×</button>
    </div>
  </div>
  <form id="q-form">
    <div class="top-row">
      <div class="brand-mark" title="Drag to move Quick Prompt">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
          <path d="M12 2v20M4.9 4.9l14.2 14.2M2 12h20M4.9 19.1L19.1 4.9"/>
        </svg>
      </div>
      <textarea id="q-input" rows="1" placeholder="What can Kronos help you with?" autofocus></textarea>
      <select id="sess-select" title="Active conversation">
        <option value="">New Chat</option>
      </select>
      <button id="q-voice" type="button" title="Voice command (Cmd+Shift+V)" aria-label="Voice command">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10a7 7 0 0 0 14 0"/>
          <path d="M12 17v4"/>
          <path d="M8 21h8"/>
        </svg>
      </button>
      <button id="q-send" type="submit" title="Send (Enter)">↑</button>
    </div>
    <div id="q-voice-bar">
      <div class="q-voice-left">
        <div class="q-eq" id="q-eq"><span></span><span></span><span></span><span></span><span></span></div>
        <span id="q-voice-text">Listening…</span>
      </div>
      <div class="q-voice-btns">
        <button id="q-voice-settings" class="act-btn" type="button" style="display:none">Enable Mic ↗</button>
        <button id="q-voice-done" class="act-btn dev-on" type="button">Done</button>
        <button id="q-voice-cancel" class="act-btn" type="button">Cancel</button>
      </div>
    </div>
    <div id="tray"></div>
  </form>

  <div id="answer-wrap"></div>

  <div class="bar-footer">
    <div class="meta-left">
      <span id="q-status">⌥Space · local Metal engine ready</span>
    </div>
    <div class="actions-right">
      <input id="q-file" type="file" multiple hidden>
      <button id="btn-device" class="act-btn" type="button" title="Toggle Develop Context for Device">Device: OFF</button>
      <button id="btn-shot" class="act-btn" type="button" title="Drag to capture a screen region">Capture screen</button>
      <button id="btn-attach" class="act-btn" type="button" title="Attach PDF, image, or code file">Attach file</button>
      <button id="btn-copy" class="act-btn" type="button" style="display:none">Copy</button>
      <button id="btn-open" class="act-btn" type="button" title="Continue in full Kronos Workspace">Open Workspace ↗</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const qInput = $("q-input"), qSend = $("q-send"), qVoice = $("q-voice"), tray = $("tray"), ansWrap = $("answer-wrap");
let quickSessionId = "";
let quickTitle = "";
let quickCreatedAt = 0;
let quickMessages = [];
let quickTurns = [];
let pendingAttachments = [];
let lastReplyText = "";
let activeWorkdir = "";
let pendingVoiceBadge = "";
let qVoiceSession = null;

const isNativeHost = Boolean(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.kronos);
if (!isNativeHost) {
  document.body.classList.add("standalone");
}

function postHost(msg) {
  try {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.kronos) {
      window.webkit.messageHandlers.kronos.postMessage(msg);
      return true;
    }
  } catch (e) {}
  return false;
}

function syncPanelHeight() {
  requestAnimationFrame(() => {
    const rawH = Math.ceil($("shell").getBoundingClientRect().height);
    const h = Math.min(Math.max(rawH, 124), 560);
    postHost({ type: "resize", height: h });
  });
}

function escHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function baseNamePath(p) {
  const clean = String(p || "").replace(/\/+$/, "");
  const parts = clean.split("/");
  return parts[parts.length - 1] || clean || "workspace";
}

function setQuickEqLevel(level) {
  const bars = $("q-eq").querySelectorAll("span");
  const weights = [0.45, 0.8, 1.0, 0.75, 0.5];
  const lv = Math.max(0, Math.min(1, Number(level) || 0));
  bars.forEach((b, i) => {
    const h = Math.round(4 + lv * 13 * weights[i]);
    b.style.height = `${h}px`;
  });
}

function showQuickVoiceBar(msg, opts = {}) {
  const bar = $("q-voice-bar");
  bar.classList.toggle("active", Boolean(msg));
  bar.classList.toggle("denied", Boolean(opts.denied));
  $("q-voice-text").textContent = msg || "";
  $("q-voice-settings").style.display = opts.denied ? "inline-block" : "none";
  $("q-voice-done").style.display = opts.showDone === false ? "none" : "inline-block";
  if (!msg) setQuickEqLevel(0);
  syncPanelHeight();
}

function applyQuickVoiceTranscript(j) {
  const spoken = String(j.text || "").trim();
  if (!spoken) {
    $("q-status").textContent = "No speech detected — click mic to speak again";
    showQuickVoiceBar("", {});
    qInput.focus();
    return;
  }
  showQuickVoiceBar("", {});
  const existing = qInput.value.trim();
  qInput.value = existing ? (existing + " " + spoken) : spoken;
  qInput.dispatchEvent(new Event("input"));
  const ms = Math.round(j.transcribe_ms || 0);
  pendingVoiceBadge = `voice · ${ms} ms`;
  $("q-status").textContent = `Transcribed in ${ms} ms`;
  if (!qSend.disabled) {
    $("q-form").requestSubmit();
  }
}

async function stopQuickVoice(cancelOnly) {
  const sess = qVoiceSession;
  if (!sess || sess.stopping) {
    showQuickVoiceBar("", {});
    return;
  }
  sess.stopping = true;
  qVoiceSession = null;
  if (sess.pollTimer) clearInterval(sess.pollTimer);
  qVoice.classList.remove("recording");

  if (cancelOnly) {
    qVoice.classList.remove("transcribing");
    showQuickVoiceBar("", {});
    $("q-status").textContent = "Voice input cancelled";
    fetch("/v1/speech/record/stop", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cancel: true }),
    }).catch(() => {});
    postHost({ type: "mic_end" });
    qInput.focus();
    return;
  }

  qVoice.classList.add("transcribing");
  setQuickEqLevel(0.25);
  showQuickVoiceBar("Transcribing on Neural Engine…", { showDone: false });
  $("q-status").textContent = "Transcribing on Neural Engine…";
  try {
    const r = await fetch("/v1/speech/record/stop", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cancel: false }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || r.statusText);
    applyQuickVoiceTranscript(j);
  } catch (err) {
    showQuickVoiceBar("", {});
    $("q-status").textContent = "Voice error: " + err.message;
  } finally {
    qVoice.classList.remove("transcribing");
    postHost({ type: "mic_end" });
  }
}

async function startQuickVoice() {
  if (qVoice.classList.contains("transcribing")) return;
  if (qVoiceSession) {
    await stopQuickVoice(false);
    return;
  }

  const sess = {
    startedAt: performance.now(),
    stopping: false,
    pollBusy: false,
    pollTimer: null,
  };
  qVoiceSession = sess;
  postHost({ type: "mic_begin" });
  qVoice.classList.add("recording");
  setQuickEqLevel(0.22);
  showQuickVoiceBar("Starting microphone… allow access if macOS prompts", { showDone: true });
  $("q-status").textContent = "Starting microphone…";

  try {
    const r = await fetch("/v1/speech/record/start", { method: "POST" });
    const j = await r.json();
    if (qVoiceSession !== sess || sess.stopping) {
      fetch("/v1/speech/record/stop", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ cancel: true }),
      }).catch(() => {});
      return;
    }
    if (!r.ok) throw new Error(j.error?.message || r.statusText);

    if (j.status === "denied") {
      qVoiceSession = null;
      qVoice.classList.remove("recording");
      postHost({ type: "mic_end" });
      showQuickVoiceBar(j.message || "Enable Kronos in macOS Privacy -> Microphone", {
        denied: true,
        showDone: false,
      });
      $("q-status").textContent = "Microphone access disabled in macOS Settings";
      return;
    }

    sess.startedAt = performance.now();
    showQuickVoiceBar("Listening 0:00 · speak naturally (Enter or Done to send)", { showDone: true });
    $("q-status").textContent = "Listening · auto-sends on pause";

    sess.pollTimer = setInterval(async () => {
      if (qVoiceSession !== sess || sess.stopping || sess.pollBusy) return;
      sess.pollBusy = true;
      try {
        const pr = await fetch("/v1/speech/record/poll");
        if (!pr.ok || qVoiceSession !== sess || sess.stopping) return;
        const pj = await pr.json();
        if (qVoiceSession !== sess || sess.stopping) return;
        if (pj.status === "recording") {
          setQuickEqLevel(Math.max(0.12, Number(pj.level) || 0));
          const sec = Math.floor((pj.elapsed_ms || (performance.now() - sess.startedAt)) / 1000);
          const mm = Math.floor(sec / 60);
          const ss = String(sec % 60).padStart(2, "0");
          const hint = pj.heard_speech ? "pause to auto-send or click Done" : "speak command now";
          showQuickVoiceBar(`Listening ${mm}:${ss} · ${hint}`, { showDone: true });
        } else if (pj.status === "done") {
          sess.stopping = true;
          qVoiceSession = null;
          clearInterval(sess.pollTimer);
          qVoice.classList.remove("recording");
          qVoice.classList.remove("transcribing");
          postHost({ type: "mic_end" });
          applyQuickVoiceTranscript(pj);
        } else if (pj.status === "idle") {
          sess.stopping = true;
          qVoiceSession = null;
          clearInterval(sess.pollTimer);
          qVoice.classList.remove("recording");
          postHost({ type: "mic_end" });
          showQuickVoiceBar("", {});
        }
      } catch (e) {
      } finally {
        sess.pollBusy = false;
      }
    }, 115);
  } catch (err) {
    if (qVoiceSession === sess) qVoiceSession = null;
    qVoice.classList.remove("recording");
    postHost({ type: "mic_end" });
    showQuickVoiceBar("Voice startup failed: " + err.message, { denied: false, showDone: false });
    $("q-status").textContent = "Voice error: " + err.message;
  }
}

qVoice.onclick = () => startQuickVoice();
$("q-voice-done").onclick = () => stopQuickVoice(false);
$("q-voice-cancel").onclick = () => {
  if (qVoiceSession) {
    stopQuickVoice(true);
  } else {
    showQuickVoiceBar("", {});
  }
};
$("q-voice-settings").onclick = () => {
  fetch("/v1/speech/settings", { method: "POST" }).catch(() => {});
};
window.kronosStartVoice = () => {
  if (!qVoiceSession) startQuickVoice();
};

function renderMd(md) {
  const esc = escHtml(md);
  return esc.split(/```/).map((part, i) => {
    if (i % 2) return "<pre><code>" + part.replace(/^[\w+-]*\n/, "") + "</code></pre>";
    return part.replace(/`([^`\n]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  }).join("");
}

async function loadSessionsList() {
  try {
    const r = await fetch("/v1/sessions");
    if (!r.ok) return;
    const j = await r.json();
    if (j.active_workdir) activeWorkdir = j.active_workdir;
    const sel = $("sess-select");
    const cur = quickSessionId;
    sel.innerHTML = '<option value="">New Chat</option>';
    for (const s of (j.sessions || []).slice(0, 15)) {
      const opt = document.createElement("option");
      opt.value = s.id;
      opt.textContent = (s.title || "Untitled").slice(0, 28);
      sel.appendChild(opt);
    }
    sel.value = cur;
  } catch (e) {}
}

function resetQuickChat() {
  quickSessionId = "";
  quickTitle = "";
  quickCreatedAt = 0;
  quickMessages = [];
  quickTurns = [];
  lastReplyText = "";
  $("btn-copy").style.display = "none";
  ansWrap.innerHTML = "";
  ansWrap.classList.remove("open");
  $("sess-select").value = "";
  $("q-status").textContent = "⌥Space · New chat ready";
  syncPanelHeight();
  qInput.focus();
}

window.kronosFocusInput = () => {
  loadSessionsList();
  syncQuickDeviceStatus();
  syncPanelHeight();
  qInput.focus();
};

window.kronosNewChat = () => resetQuickChat();

$("sess-select").onchange = async () => {
  const id = $("sess-select").value;
  if (!id) {
    resetQuickChat();
    return;
  }
  try {
    const r = await fetch("/v1/sessions/get?id=" + encodeURIComponent(id));
    if (!r.ok) return;
    const s = await r.json();
    quickSessionId = s.id;
    quickTitle = s.title || "Conversation";
    quickCreatedAt = s.created_at || Math.floor(Date.now() / 1000);
    quickMessages = Array.isArray(s.messages) ? s.messages : [];
    quickTurns = Array.isArray(s.turns) ? s.turns : [];
    ansWrap.innerHTML = "";
    for (const t of quickTurns.slice(-4)) {
      if (t.userText) {
        const u = document.createElement("div");
        u.className = "q-turn-user";
        u.textContent = t.userText;
        ansWrap.appendChild(u);
      }
      if (t.prose) {
        const a = document.createElement("div");
        a.className = "q-turn-reply";
        a.innerHTML = renderMd(t.prose);
        ansWrap.appendChild(a);
        lastReplyText = t.prose;
      }
    }
    ansWrap.classList.toggle("open", ansWrap.children.length > 0);
    ansWrap.scrollTop = ansWrap.scrollHeight;
    syncPanelHeight();
  } catch (e) {}
};

function renderTray() {
  tray.innerHTML = "";
  tray.classList.toggle("has-items", pendingAttachments.length > 0);
  pendingAttachments.forEach((att, idx) => {
    const c = document.createElement("div");
    c.className = "chip";
    if (att.isImage) {
      const im = document.createElement("img");
      im.src = att.dataUrl;
      im.alt = att.name;
      c.appendChild(im);
    } else {
      const tag = document.createElement("span");
      tag.className = "chip-tag";
      tag.textContent = att.ext || "file";
      c.appendChild(tag);
    }
    const nm = document.createElement("span");
    nm.textContent = att.name.slice(0, 26);
    const rm = document.createElement("button");
    rm.type = "button";
    rm.textContent = "×";
    rm.onclick = () => {
      pendingAttachments.splice(idx, 1);
      renderTray();
      syncPanelHeight();
    };
    c.appendChild(nm);
    c.appendChild(rm);
    tray.appendChild(c);
  });
  syncPanelHeight();
}

function ingestFileBlob(file, fallbackName) {
  return new Promise((resolve) => {
    const name = file.name || fallbackName || "attachment";
    const mime = file.type || "application/octet-stream";
    const ext = (name.includes(".") ? name.split(".").pop() : (mime.split("/")[1] || "file")).toLowerCase();
    const isImg = mime.startsWith("image/") || ["png", "jpg", "jpeg", "webp", "gif"].includes(ext);
    const reader = new FileReader();
    reader.onload = () => {
      const rawUrl = String(reader.result || "");
      if (!isImg) {
        pendingAttachments.push({ name, mime, ext, dataUrl: rawUrl, isImage: false });
        renderTray();
        resolve(true);
        return;
      }
      const im = new Image();
      im.onload = () => {
        const maxSide = 1440;
        let w = im.naturalWidth || 1, h = im.naturalHeight || 1, dataUrl = rawUrl;
        if (Math.max(w, h) > maxSide) {
          const sc = maxSide / Math.max(w, h);
          w = Math.max(1, Math.round(w * sc));
          h = Math.max(1, Math.round(h * sc));
          const cv = document.createElement("canvas");
          cv.width = w; cv.height = h;
          cv.getContext("2d").drawImage(im, 0, 0, w, h);
          dataUrl = cv.toDataURL("image/png");
        }
        pendingAttachments.push({ name, mime: "image/png", ext: "png", dataUrl, isImage: true });
        renderTray();
        resolve(true);
      };
      im.onerror = () => resolve(false);
      im.src = rawUrl;
    };
    reader.onerror = () => resolve(false);
    reader.readAsDataURL(file);
  });
}

window.kronosReceiveNativeFile = (name, mime, dataUrl) => {
  const safeName = name || "attachment";
  const safeMime = mime || "application/octet-stream";
  const ext = (safeName.includes(".") ? safeName.split(".").pop() : (safeMime.split("/")[1] || "file")).toLowerCase();
  const isImage = safeMime.startsWith("image/") || ["png", "jpg", "jpeg", "webp", "gif"].includes(ext);
  pendingAttachments.push({ name: safeName, mime: safeMime, ext, dataUrl, isImage });
  renderTray();
  qInput.focus();
};

$("btn-attach").onclick = () => {
  if (!postHost({ type: "pick_file" })) $("q-file").click();
};
$("q-file").onchange = async (e) => {
  for (const f of Array.from(e.target.files || [])) {
    await ingestFileBlob(f, f.name);
  }
  e.target.value = "";
  qInput.focus();
};

$("btn-shot").onclick = async () => {
  $("q-status").textContent = "Select a screen region…";
  postHost({ type: "capture_begin" });
  try {
    const r = await fetch("/v1/screencapture", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: "interactive" }),
    });
    const j = await r.json();
    if (j.status === "ok" && j.data) {
      pendingAttachments.push({
        name: j.name || "screenshot.png",
        mime: "image/png",
        ext: "png",
        dataUrl: j.data,
        isImage: true,
      });
      renderTray();
      $("q-status").textContent = "Screenshot attached";
    } else {
      $("q-status").textContent = "Screen capture cancelled";
    }
  } catch (e) {
    $("q-status").textContent = "Screen capture unavailable";
  } finally {
    postHost({ type: "capture_end" });
  }
  qInput.focus();
};

window.addEventListener("paste", async (e) => {
  const files = Array.from(e.clipboardData?.files || []);
  if (files.length > 0) {
    e.preventDefault();
    for (const f of files) await ingestFileBlob(f, f.name || "clipboard");
    qInput.focus();
    return;
  }
  const items = Array.from(e.clipboardData?.items || []).filter(it => it.kind === "file");
  if (items.length > 0) {
    e.preventDefault();
    for (const it of items) {
      const f = it.getAsFile();
      if (f) await ingestFileBlob(f, f.name || "clipboard");
    }
    qInput.focus();
  }
});

const shell = $("shell");
let dragState = null;
let browserDragX = 0;
let browserDragY = 0;

function isInteractiveDragTarget(el) {
  return Boolean(el && el.closest("textarea, input, select, button, a, #answer-wrap, #q-voice-bar, .chip"));
}

shell.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 || isInteractiveDragTarget(e.target)) return;
  e.preventDefault();
  try { shell.setPointerCapture(e.pointerId); } catch (err) {}
  shell.classList.add("is-dragging");
  const native = postHost({ type: "drag_start", sx: e.screenX, sy: e.screenY });
  dragState = {
    id: e.pointerId,
    startSx: e.screenX,
    startSy: e.screenY,
    baseX: browserDragX,
    baseY: browserDragY,
    native,
  };
});

shell.addEventListener("pointermove", (e) => {
  if (!dragState || e.pointerId !== dragState.id) return;
  const dx = e.screenX - dragState.startSx;
  const dy = e.screenY - dragState.startSy;
  if (dragState.native) {
    postHost({ type: "drag_move", sx: e.screenX, sy: e.screenY, dx, dy });
  } else {
    browserDragX = dragState.baseX + dx;
    browserDragY = dragState.baseY + dy;
    shell.style.transform = `translate(${browserDragX}px, ${browserDragY}px)`;
  }
});

function finishShellDrag(e) {
  if (!dragState || (e && e.pointerId !== dragState.id)) return;
  if (dragState.native) {
    postHost({ type: "drag_end" });
  }
  try { if (e) shell.releasePointerCapture(e.pointerId); } catch (err) {}
  dragState = null;
  shell.classList.remove("is-dragging");
  qInput.focus();
}

shell.addEventListener("pointerup", finishShellDrag);
shell.addEventListener("pointercancel", finishShellDrag);

$("drag-bar").addEventListener("dblclick", (e) => {
  if (isInteractiveDragTarget(e.target)) return;
  if (!postHost({ type: "reset_pos" })) {
    browserDragX = 0;
    browserDragY = 0;
    shell.style.transform = "";
  }
});

$("q-new").onclick = () => resetQuickChat();
$("q-close").onclick = () => {
  if (!postHost({ type: "hide" })) resetQuickChat();
};
document.body.addEventListener("pointerdown", (e) => {
  if (e.target === document.body) {
    if (!postHost({ type: "hide" })) resetQuickChat();
  }
});

shell.addEventListener("dragover", (e) => { e.preventDefault(); shell.classList.add("drag-over"); });
shell.addEventListener("dragleave", () => shell.classList.remove("drag-over"));
shell.addEventListener("drop", async (e) => {
  e.preventDefault();
  shell.classList.remove("drag-over");
  for (const f of Array.from(e.dataTransfer?.files || [])) {
    await ingestFileBlob(f, f.name);
  }
  qInput.focus();
});

qInput.addEventListener("input", () => {
  qInput.style.height = "auto";
  qInput.style.height = Math.min(qInput.scrollHeight, 96) + "px";
  syncPanelHeight();
});

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    e.preventDefault();
    if (qVoiceSession) {
      stopQuickVoice(true);
      return;
    }
    if (!postHost({ type: "hide" })) resetQuickChat();
  } else if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === "v") {
    e.preventDefault();
    startQuickVoice();
  } else if (e.key === "Enter" && qVoiceSession && !e.shiftKey) {
    e.preventDefault();
    stopQuickVoice(false);
  } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "n") {
    e.preventDefault();
    resetQuickChat();
  }
});

qInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    if (qVoiceSession) {
      stopQuickVoice(false);
    } else {
      $("q-form").requestSubmit();
    }
  }
});

$("btn-copy").onclick = async () => {
  if (!lastReplyText) return;
  try {
    await navigator.clipboard.writeText(lastReplyText);
    $("q-status").textContent = "Copied reply to clipboard";
  } catch (e) {}
};

$("btn-open").onclick = () => {
  const target = quickSessionId
    ? `http://127.0.0.1:18080/#session=${encodeURIComponent(quickSessionId)}`
    : "http://127.0.0.1:18080/";
  if (!postHost({ type: "open_url", url: target })) {
    window.open(target, "_blank");
  }
};

async function persistQuickSession(ctxTokens) {
  if (!quickSessionId) {
    quickSessionId = "sess_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
    quickCreatedAt = Math.floor(Date.now() / 1000);
  }
  const nowSec = Math.floor(Date.now() / 1000);
  try {
    await fetch("/v1/sessions/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        id: quickSessionId,
        title: quickTitle || "Quick Prompt",
        workdir: activeWorkdir,
        created_at: quickCreatedAt,
        updated_at: nowSec,
        context_tokens: ctxTokens || 0,
        added_lines: 0,
        removed_lines: 0,
        changed_files: 0,
        messages: quickMessages,
        turns: quickTurns,
      }),
    });
    loadSessionsList();
  } catch (e) {}
}

$("q-form").onsubmit = async (e) => {
  e.preventDefault();
  const text = qInput.value.trim();
  if ((!text && pendingAttachments.length === 0) || qSend.disabled) return;
  const atts = pendingAttachments.slice();
  pendingAttachments = [];
  renderTray();
  qInput.value = "";
  qInput.style.height = "auto";
  qSend.disabled = true;

  if (!quickTitle) {
    quickTitle = (text || (atts[0]?.name || "Quick Prompt")).slice(0, 48);
  }

  const prevLen = quickMessages.length;
  quickMessages.push({ role: "user", content: text });

  ansWrap.classList.add("open");
  const uEl = document.createElement("div");
  uEl.className = "q-turn-user";
  uEl.textContent = text || atts.map(a => a.name).join(", ");
  ansWrap.appendChild(uEl);

  const badgeRow = document.createElement("div");
  badgeRow.className = "q-badges";
  ansWrap.appendChild(badgeRow);

  const rEl = document.createElement("div");
  rEl.className = "q-turn-reply";
  rEl.textContent = "…";
  ansWrap.appendChild(rEl);
  ansWrap.scrollTop = ansWrap.scrollHeight;
  syncPanelHeight();

  $("q-status").textContent = "Generating…";
  let prose = "";
  let routeMode = "chat";
  const badges = [];
  if (pendingVoiceBadge) {
    badges.push(pendingVoiceBadge);
    const vp = document.createElement("span");
    vp.className = "q-pill";
    vp.textContent = pendingVoiceBadge;
    badgeRow.appendChild(vp);
    pendingVoiceBadge = "";
  }
  const toolRecords = [];
  let verifyRecord = null;
  let ctxTokens = 0;

  try {
    const payload = {
      messages: quickMessages,
      route: "auto",
      attachments: atts.map(a => ({ name: a.name, mime: a.mime, data: a.dataUrl })),
    };
    const r = await fetch("/v1/turn", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!r.ok) throw new Error((await r.json()).error?.message || r.statusText);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, idx).replace(/^data: /, "");
        buf = buf.slice(idx + 2);
        if (!line || line === "[DONE]") continue;
        const j = JSON.parse(line);
        if (j.type === "error") throw new Error(j.message || "turn failed");
        if (j.type === "route") {
          routeMode = j.mode || "chat";
          const p = document.createElement("span");
          p.className = "q-pill";
          p.textContent = routeMode === "agent"
            ? "agent · workspace"
            : (routeMode === "computer" ? "computer · macOS" : "chat");
          badgeRow.appendChild(p);
        } else if (j.type === "device_context") {
          const b = `device · ${j.hits || 0} matches · ${(j.elapsed_ms || 0).toFixed(2)} ms`;
          badges.push(b);
          const p = document.createElement("span");
          p.className = "q-pill";
          p.textContent = b;
          badgeRow.appendChild(p);
          for (const it of (j.items || []).filter(x => x.exists_on_disk && x.path).slice(0, 2)) {
            const c = document.createElement("button");
            c.type = "button";
            c.className = "q-open-chip";
            c.textContent = `Open ${it.name.slice(0, 26)} ↗`;
            c.title = it.path;
            c.onclick = () => fetch("/v1/device/open", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: it.kind === "app" ? "open_app" : "open_file", target: it.path }),
            }).catch(() => {});
            badgeRow.appendChild(c);
          }
          syncPanelHeight();
        } else if (j.type === "attachments") {
          for (const item of (j.items || [])) {
            badges.push(item.badge);
            const p = document.createElement("span");
            p.className = "q-pill";
            p.textContent = item.badge;
            badgeRow.appendChild(p);
          }
        } else if (j.type === "text") {
          prose += j.delta;
          rEl.innerHTML = renderMd(prose);
          ansWrap.scrollTop = ansWrap.scrollHeight;
          syncPanelHeight();
        } else if (j.type === "tool_progress") {
          $("q-status").textContent = `Drafting ${j.name} ${j.target || ""} (${j.bytes} B)…`;
        } else if (j.type === "workspace_changed") {
          if (j.workdir) {
            activeWorkdir = j.workdir;
            const wb = `workspace · ${baseNamePath(j.workdir)}`;
            badges.push(wb);
            const p = document.createElement("span");
            p.className = "q-pill";
            p.textContent = wb;
            p.title = j.workdir;
            badgeRow.appendChild(p);
            loadSessionsList();
            syncPanelHeight();
          }
        } else if (j.type === "tool_done") {
          toolRecords.push({
            id: j.id,
            name: j.name,
            ok: j.ok,
            validation_ok: j.validation_ok,
            output: j.output,
            diff: j.diff || null,
          });
        } else if (j.type === "verified") {
          verifyRecord = j;
          const p = document.createElement("span");
          p.className = "q-pill";
          p.textContent = `verified · ${j.checks_run} checks`;
          badgeRow.appendChild(p);
        } else if (j.type === "jev_verification") {
          if (j.passed || j.rolled_back) {
            const p = document.createElement("span");
            p.className = "q-pill";
            const pct = Math.round((j.score || 0) * 100);
            p.textContent = j.rolled_back ? `jev ${pct}% · restored` : `jev ${pct}%`;
            badgeRow.appendChild(p);
          }
        } else if (j.type === "step_stats") {
          const u = j.usage || {};
          const rate = (u.completion_tokens / Math.max(u.decode_secs || 1e-3, 1e-3)).toFixed(1);
          $("q-status").textContent = `${rate} tok/s · ${u.completion_tokens} tokens`;
        } else if (j.type === "done") {
          if (Array.isArray(j.messages)) quickMessages = j.messages;
          ctxTokens = j.context_tokens || 0;
          if (!prose && j.text) {
            prose = j.text;
            rEl.innerHTML = renderMd(prose);
          }
        }
      }
    }
    lastReplyText = prose;
    $("btn-copy").style.display = prose ? "inline-block" : "none";
    quickTurns.push({
      userText: text,
      attachments: atts.map(a => ({ name: a.name, ext: a.ext, isImage: a.isImage, dataUrl: a.isImage ? a.dataUrl : "" })),
      route: routeMode,
      badges,
      tools: toolRecords,
      verified: verifyRecord,
      prose,
    });
    await persistQuickSession(ctxTokens);
    syncPanelHeight();
  } catch (err) {
    rEl.textContent = "Error: " + err.message;
    quickMessages.length = prevLen;
    syncPanelHeight();
  } finally {
    qSend.disabled = false;
    qInput.focus();
  }
};

let qDeviceEnabled = false;
async function syncQuickDeviceStatus() {
  try {
    const r = await fetch("/v1/device/status");
    if (!r.ok) return;
    const st = await r.json();
    qDeviceEnabled = !!st.enabled;
    const btn = $("btn-device");
    btn.classList.toggle("dev-on", qDeviceEnabled);
    btn.textContent = qDeviceEnabled ? `Device: ON (${st.indexed_entries || 0})` : "Device: OFF";
  } catch (e) {}
}
$("btn-device").onclick = async () => {
  try {
    const r = await fetch("/v1/device/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ enabled: !qDeviceEnabled }),
    });
    if (r.ok) {
      const st = await r.json();
      qDeviceEnabled = !!st.enabled;
      const btn = $("btn-device");
      btn.classList.toggle("dev-on", qDeviceEnabled);
      btn.textContent = qDeviceEnabled ? `Device: ON (${st.indexed_entries || 0})` : "Device: OFF";
      $("q-status").textContent = qDeviceEnabled
        ? `Device Context active · ${st.indexed_entries || 0} items (${(st.build_ms || 0).toFixed(1)} ms)`
        : "Device Context paused";
    }
  } catch (e) {}
  qInput.focus();
};

loadSessionsList();
syncQuickDeviceStatus();
syncPanelHeight();
