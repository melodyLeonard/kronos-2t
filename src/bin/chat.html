<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kronos Chat</title>
<style>
  :root { --bg:#fafaf9; --panel:#fff; --text:#1c1917; --muted:#78716c; --line:#e7e5e4; --me:#1c1917; --me-text:#fafaf9; --accent:#c2410c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0c0a09; --panel:#1c1917; --text:#f5f5f4; --muted:#a8a29e; --line:#292524; --me:#f5f5f4; --me-text:#0c0a09; --accent:#fb923c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; height:100dvh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .model { color:var(--muted); font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button, select, input { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
  button { cursor:pointer; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; max-width:820px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; max-width:85%; }
  .user { align-self:flex-end; background:var(--me); color:var(--me-text); }
  .assistant { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .assistant code { font:13px ui-monospace, SFMono-Regular, Menlo, monospace; background:var(--line); padding:1px 4px; border-radius:4px; }
  .assistant pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; overflow-x:auto; white-space:pre; margin:6px 0; }
  .assistant pre code { background:none; padding:0; }
  .stats { align-self:flex-start; color:var(--muted); font-size:12px; margin-top:-6px; }
  .empty { margin:auto; color:var(--muted); text-align:center; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); max-width:820px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-height:44px; max-height:200px; }
  #send { background:var(--accent); color:#fff; border:none; padding:0 18px; }
  #send:disabled { opacity:.5; }
  details { font-size:13px; color:var(--muted); }
  details label { display:flex; justify-content:space-between; gap:8px; margin:6px 0; }
  details input { width:110px; }
  .settings { position:absolute; right:16px; top:52px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; z-index:2; }
</style>
</head>
<body>
<header>
  <h1>Kronos</h1>
  <span class="model" id="model">connecting…</span>
  <details>
    <summary>Settings</summary>
    <div class="settings">
      <label>Temperature <input id="temp" type="number" step="0.1" min="0" max="2" value="0.7"></label>
      <label>Max tokens <input id="maxtok" type="number" min="1" max="2048" value="512"></label>
      <label>System <input id="system" placeholder="default"></label>
      <label>API key <input id="key" type="password" placeholder="if required"></label>
    </div>
  </details>
  <button id="new" type="button">New chat</button>
</header>
<main id="log"><div class="empty" id="empty">Ask anything. Replies stream from the local Kronos server.</div></main>
<form id="form">
  <textarea id="input" rows="1" placeholder="Message Kronos…" autofocus></textarea>
  <button id="send" type="submit">Send</button>
</form>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), send = $("send");
let history = [];

const store = (k, v) => { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); } catch (e) {} return v; };
for (const id of ["temp", "maxtok", "system", "key"]) {
  const saved = store("kronos-" + id); if (saved !== null && saved !== undefined) $(id).value = saved;
  $(id).addEventListener("change", () => store("kronos-" + id, $(id).value));
}
const headers = () => {
  const h = { "Content-Type": "application/json" };
  if ($("key").value) h.Authorization = "Bearer " + $("key").value;
  return h;
};
fetch("/v1/models", { headers: headers() }).then(r => r.json())
  .then(j => $("model").textContent = j.data ? j.data[0].id : (j.error?.message || "unavailable"))
  .catch(() => $("model").textContent = "server unreachable");

// Escape first, then apply a few Markdown forms; nothing from the model is inserted as raw HTML.
function render(md) {
  const esc = md.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc.split(/```/).map((part, i) => {
    if (i % 2) return "<pre><code>" + part.replace(/^[\w+-]*\n/, "") + "</code></pre>";
    return part.replace(/`([^`\n]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/^#{1,6} (.*)$/gm, "<strong>$1</strong>");
  }).join("");
}

function bubble(role, text) {
  $("empty")?.remove();
  const d = document.createElement("div");
  d.className = "msg " + role; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

$("new").onclick = () => { history = []; log.innerHTML = '<div class="empty" id="empty">New conversation.</div>'; input.focus(); };
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 200) + "px"; });
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  input.value = ""; input.style.height = "auto";
  history.push({ role: "user", content: text });
  bubble("user", text);
  const out = bubble("assistant", "…");
  send.disabled = true;
  const messages = $("system").value ? [{ role: "system", content: $("system").value }, ...history] : history;
  const t0 = performance.now();
  let reply = "", usage = null, first = null;
  try {
    const r = await fetch("/v1/chat/completions", {
      method: "POST", headers: headers(),
      body: JSON.stringify({ messages, stream: true, temperature: +$("temp").value, max_tokens: +$("maxtok").value }),
    });
    if (!r.ok) throw new Error((await r.json()).error?.message || r.statusText);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i).replace(/^data: /, ""); buf = buf.slice(i + 2);
        if (line === "[DONE]") continue;
        const j = JSON.parse(line);
        if (j.error) throw new Error(j.error.message);
        const piece = j.choices?.[0]?.delta?.content;
        if (piece) { first ??= performance.now(); reply += piece; out.innerHTML = render(reply); log.scrollTop = log.scrollHeight; }
        if (j.usage) usage = j.usage;
      }
    }
    history.push({ role: "assistant", content: reply });
    if (usage && first) {
      const s = document.createElement("div"); s.className = "stats";
      const secs = (performance.now() - first) / 1000;
      s.textContent = `${usage.completion_tokens} tokens · ${(usage.completion_tokens / Math.max(secs, 1e-3)).toFixed(1)} tok/s · first token ${((first - t0) / 1000).toFixed(2)} s`;
      log.appendChild(s);
    }
  } catch (err) {
    out.textContent = "Error: " + err.message; history.pop();
  } finally {
    send.disabled = false; input.focus();
  }
};
</script>
</body>
</html>
