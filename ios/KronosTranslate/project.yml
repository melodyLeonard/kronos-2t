name: KronosTranslate
options:
  bundleIdPrefix: com.melodyleonard
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  KronosTranslate:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Translate
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Reaches your Mac on the local network to translate.
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.melodyleonard.kronostranslate]
    dependencies:
      - target: KronosKeyboard
        embed: true
  KronosKeyboard:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melodyleonard.KronosTranslate.keyboard
    sources:
      - path: Keyboard
      - path: Shared
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Kronos
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Reaches your Mac on the local network to translate.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.melodyleonard.kronostranslate]
