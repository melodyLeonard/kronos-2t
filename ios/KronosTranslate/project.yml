name: KronosTranslate
options:
  bundleIdPrefix: com.melodyleonard
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: CU42G7MK57
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  KronosTranslate:
    type: application
    platform: iOS
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Translate
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Reaches your Mac on the local network to translate.
    dependencies:
      - target: KronosKeyboard
        embed: true
  KronosKeyboard:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melodyleonard.KronosTranslate.keyboard
        SWIFT_OBJC_BRIDGING_HEADER: Keyboard/Engine/Kronos-Bridging-Header.h
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) KRONOS_LOCAL_ENGINE
        OTHER_LDFLAGS: -lkronos_2t
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/../../target/aarch64-apple-ios/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/../../target/aarch64-apple-ios-sim/release
    sources:
      - path: Keyboard
        excludes: [Engine/Hy-MT2-1.8B]
      - path: Keyboard/Engine/Hy-MT2-1.8B
        type: folder
        buildPhase: resources
      - path: Shared
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Kronos
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Reaches your Mac on the local network to translate.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
  KronosTranslateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        TEST_TARGET_NAME: KronosTranslate
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: KronosTranslate
schemes:
  KronosTranslate:
    build:
      targets:
        KronosTranslate: all
        KronosKeyboard: all
        KronosTranslateUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KronosTranslateUITests
